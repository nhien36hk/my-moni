services:
  # 1. MongoDB
  mongodb:
    image: mongo:latest
    container_name: budget-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # 1.1. MongoDB UI (Mongo Express)
  mongo-express:
    image: mongo-express:latest
    container_name: budget-mongo-ui
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongodb
    restart: always

  # 2. Backend (Hot Reload qua Volume)
  backend:
    build: ./backend
    container_name: budget-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/budget_db
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules # Giữ lại node_modules trong container
    depends_on:
      - mongodb
    restart: always

  # 3. Frontend (Hot Reload qua Volume)
  frontend:
    build: ./frontend
    container_name: budget-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Giữ lại node_modules trong container
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
